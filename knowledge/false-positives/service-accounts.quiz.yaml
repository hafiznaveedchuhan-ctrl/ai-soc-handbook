quiz:
  title: "False positives: service accounts"
  questionsPerRound: 6
questions:
  - question: "Which Logon Type is usually normal for service accounts?"
    options:
      - "Type 2 (Interactive)"
      - "Type 5 (Service)"
      - "Type 10 (RemoteInteractive)"
      - "Type 3 (Network)"
    answer: 1
    explanation: "Microsoft: service accounts logging on with Logon Type 5 is usually normal."
    source: "Normal and abnormal"
  - question: "Which accounts have passwords managed by Windows?"
    options:
      - "Every domain user account"
      - "Only the built-in Administrator"
      - "Only accounts in Backup Operators"
      - "sMSA, gMSA, dMSA and virtual accounts"
    answer: 3
    explanation: "Microsoft: managed service accounts and virtual accounts have Windows-managed credentials."
    source: "What a service account is"
  - question: "Which pattern does Microsoft call worth investigating?"
    options:
      - "Domain admin logging on as Type 4 or 5"
      - "Service account logon as Type 5"
      - "Managed account with Virtual Account = Yes"
      - "SYSTEM as the Subject Security ID"
    answer: 0
    explanation: "A member of a domain admin group using Batch or Service logon types is worth investigating."
    source: "Normal and abnormal"
  - question: "Which CDB lookup checks an account against its allowed host?"
    options:
      - "address_match_key"
      - "not_match_key"
      - "match_key_value"
      - "match_key only"
    answer: 2
    explanation: "Wazuh: match_key_value checks the key and then the stored value."
    source: "Handbook rule"
  - question: "Service account used with Logon Type 10. Owner rule?"
    options:
      - "Close as benign service noise"
      - "Treat as escalation condition 2"
      - "Lower severity one step"
      - "Ignore unless it repeats"
    answer: 1
    explanation: "Interactive or RemoteInteractive use of a service account = condition 2."
    source: "Handbook rule"
  - question: "A failure run from the usual host often follows…"
    options:
      - "A manual password rotation"
      - "A new Wazuh agent install"
      - "A GeoIP database update"
      - "A change of DNS server"
    answer: 0
    explanation: "Ask whether the password was recently rotated and a service still holds the old one."
    source: "Common benign cause to check"
