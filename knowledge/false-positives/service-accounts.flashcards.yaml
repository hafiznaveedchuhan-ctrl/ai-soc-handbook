deck:
  title: "False positives: service accounts"
  description: "Recall checks drawn only from the page False positives: service accounts."
cards:
  - front: "What is a service account (Microsoft)?"
    back: "A user account created to provide a security context for services."
  - front: "Who manages a traditional service account's password?"
    back: "An administrator, who sets and rotates it by hand."
  - front: "Usual logon type for a service account?"
    back: "Logon Type 5 (Service)."
  - front: "Owner naming convention for service accounts?"
    back: "Names start with svc-."
  - front: "Service-account logon from an unlisted host means…"
    back: "Escalation condition 2 applies."
