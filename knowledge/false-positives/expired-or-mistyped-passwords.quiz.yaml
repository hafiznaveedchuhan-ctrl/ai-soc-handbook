quiz:
  title: "False positives: expired or mistyped passwords"
  questionsPerRound: 6
questions:
  - question: "Which 4776 code flags 'Change Password at Next Logon'?"
    options:
      - "0xC000006A"
      - "0xC0000224"
      - "0xC0000064"
      - "0xC0000234"
    answer: 1
    explanation: "Microsoft's 4776 table: 0xC0000224 — logon with Change Password at Next Logon flagged."
    source: "The codes that tell the story"
  - question: "What does Kerberos failure code 0x18 mean?"
    options:
      - "The password has expired"
      - "The account is disabled"
      - "The clock is out of sync"
      - "The wrong password was provided"
    answer: 3
    explanation: "4771: 0x18 KDC_ERR_PREAUTH_FAILED — wrong password."
    source: "The codes that tell the story"
  - question: "Which NIST element says to consider known false positives?"
    options:
      - "DE.AE-08"
      - "ID.AM-01"
      - "RS.MA-03"
      - "DE.AE-07"
    answer: 0
    explanation: "DE.AE-08 R1: consider known false positives before declaring an incident."
    source: "Why this page exists"
  - question: "Owner threshold for a benign failed-logon candidate?"
    options:
      - "At most 8 failures in 60 minutes"
      - "At most 10 failures in one day"
      - "At most 5 failures in 15 minutes"
      - "At most 3 failures in one hour"
    answer: 2
    explanation: "Owner policy: no more than 5 failures within 15 minutes (8 in 60 is the escalation line)."
    source: "Handbook rule"
  - question: "A single-failure rule fired correctly on a harmless typo. Verdict?"
    options:
      - "False positive"
      - "Benign true positive"
      - "True positive"
      - "Needs-info"
    answer: 1
    explanation: "The rule detected a real failure correctly; it was harmless — benign TP."
    source: "Verdict wording"
  - question: "An expired-password code tells you the typed password was…"
    options:
      - "Right, but no longer usable"
      - "Wrong for a real account"
      - "For an account that is missing"
      - "Sent from an unknown machine"
    answer: 0
    explanation: "Expired / must-change codes mean the password was right but unusable — a support case."
    source: "The codes that tell the story"
