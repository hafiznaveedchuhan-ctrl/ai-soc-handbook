deck:
  title: "False positives: expired or mistyped passwords"
  description: "Recall checks drawn only from the page False positives: expired or mistyped passwords."
cards:
  - front: "4776 code 0xC000006A means…"
    back: "Account logon with misspelled or bad password."
  - front: "4776 code 0xC0000071 means…"
    back: "Account logon with expired password."
  - front: "4771 code 0x17 means…"
    back: "The user's password has expired."
  - front: "Benign threshold for failures (owner policy)?"
    back: "No more than 5 failures within 15 minutes, one account, one usual source."
  - front: "Brute-force rule fired on ordinary typos — verdict?"
    back: "False positive: the activity did not match what the rule looks for."
