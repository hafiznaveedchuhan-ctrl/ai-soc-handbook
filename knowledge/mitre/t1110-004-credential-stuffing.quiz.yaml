quiz:
  title: "T1110.004 Brute Force: Credential Stuffing"
  questionsPerRound: 6
questions:
  - question: "What does stuffing rely on?"
    options:
      - "Weak default passwords"
      - "Users reusing passwords"
      - "Unpatched SSH servers"
      - "Expired certificates"
    answer: 1
    explanation: "It relies on users reusing passwords across accounts."
    source: "The technique"
  - question: "Which event does DET0460 use?"
    options:
      - "4624"
      - "4740"
      - "4771"
      - "4625"
    answer: 3
    explanation: "Log source: Security EventCode 4625."
    source: "Detection (MITRE DET0460)"
  - question: "One source, 4625 for many usernames. Do what?"
    options:
      - "Count distinct usernames per source"
      - "Close as typos"
      - "Reset all passwords"
      - "Ignore below level 10"
    answer: 0
    explanation: "Spraying or stuffing — count distinct usernames per source."
    source: "For the agent"
  - question: "Which port does MITRE list among targeted services?"
    options:
      - "DNS 53/UDP"
      - "NTP 123/UDP"
      - "SSH 22/TCP"
      - "SNMP 161/UDP"
    answer: 2
    explanation: "MITRE lists SSH 22/TCP among commonly targeted management services."
    source: "The technique"
  - question: "Usernames look like e-mail addresses. Suggests…"
    options:
      - "A scanner"
      - "A leaked list"
      - "A backup job"
      - "A lockout storm"
    answer: 1
    explanation: "E-mail-style or ex-employee names point to a leaked list."
    source: "For the agent"
  - question: "Why is stuffing risky for the attacker?"
    options:
      - "Failures and lockouts"
      - "It needs admin rights"
      - "It is slow to run"
      - "It needs a VPN"
    answer: 0
    explanation: "It can cause many failures and account lockouts."
    source: "The technique"
