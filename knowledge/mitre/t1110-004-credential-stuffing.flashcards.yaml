deck:
  title: "T1110.004 Brute Force: Credential Stuffing"
  description: "Recall checks drawn only from the page T1110.004 Brute Force: Credential Stuffing."
cards:
  - front: "What is credential stuffing?"
    back: "Trying username/password pairs leaked from unrelated breaches, hoping for reuse."
  - front: "How does it look in logs?"
    back: "Many different users failing, each pair tried once."
  - front: "Analytic AN1262 looks for…"
    back: "Distinct username/password pairs failing from one IP or session in a short window."
  - front: "Log source for DET0460?"
    back: "WinEventLog:Security EventCode 4625."
  - front: "Any 4624 from the same source?"
    back: "Escalate per the escalation policy."
