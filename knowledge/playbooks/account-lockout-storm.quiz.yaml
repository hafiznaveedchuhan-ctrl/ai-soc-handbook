  - question: "Many accounts, one source. Action?"
    options:
      - "Escalate (spraying)"
      - "Note only"
      - "Close as benign"
      - "Reset all passwords"
    answer: 0
    explanation: "Many accounts from one source → escalate."
    source: "Escalate?"
  - question: "Admin accounts locked. Which condition?"
    options:
      - "Condition 4"
      - "Condition 7"
      - "Condition 2"
      - "Condition 1"
    answer: 2
    explanation: "Admin or service accounts → condition 2."
    source: "Escalate?"
  - question: "One user, own device, after password change?"
    options:
      - "Escalate as Critical"
      - "Benign — advise the user"
      - "Open brute-force playbook"
      - "Disable the account"
    answer: 1
    explanation: "Benign — note and advise the user."
    source: "Escalate?"
