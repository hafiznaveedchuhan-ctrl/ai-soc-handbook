    options:
      - "5"
      - "9"
      - "12"
      - "7"
    answer: 1
    explanation: "60115 User account locked out (multiple login errors), level 9."
    source: "Trigger"
  - question: "Which 4740 field names where failures came from?"
    options:
      - "Target Account Name"
      - "Subject Logon ID"
      - "Workstation Name"
      - "Caller Computer Name"
    answer: 3
    explanation: "4740 names the caller computer."
