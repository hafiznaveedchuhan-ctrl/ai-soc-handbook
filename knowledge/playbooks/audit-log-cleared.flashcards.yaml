deck:
  title: "Playbook — audit log cleared"
  description: "Recall checks drawn only from the page Playbook."
cards:
  - front: "Which Wazuh rules trigger this playbook?"
    back: "60117 (level 9) or 63103 (level 5) on event 1102."
  - front: "Which field leads to the session that cleared the log?"
    back: "SubjectLogonId → the matching 4624."
  - front: "Which commands does MITRE give for clearing logs?"
    back: "wevtutil cl security (and system, application); Remove-EventLog -LogName Security."
  - front: "What benign causes does Sigma list?"
    back: "Log-collection agent rollouts and system provisioning."
  - front: "Is it escalated?"
    back: "Yes (condition 3) unless a documented maintenance reason exists; severity Critical."
  - front: "Which MITRE ID applies?"
    back: "T1685.005 Clear Windows Event Logs (formerly T1070.001)."
