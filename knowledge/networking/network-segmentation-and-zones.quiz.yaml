quiz:
  title: "Network segmentation and zones"
  questionsPerRound: 6
questions:
  - question: "Main purpose of microsegmentation?"
    options:
      - "Speed up internet access for all users"
      - "Stop an attack from escalating"
      - "Replace all firewalls"
      - "Hide hosts from DNS"
    answer: 1
    explanation: "SP 800-215: the primary purpose is isolation to prevent attack escalation."
    source: "Segments inside the network"
  - question: "Firewalls inside a data center are used to …"
    options:
      - "assign IP addresses"
      - "encrypt all traffic"
      - "act as DNS servers"
      - "prevent lateral movement"
    answer: 3
    explanation: "SP 800-215: internal firewalls segment the network to prevent lateral movement."
    source: "Segments inside the network"
  - question: "In zero trust, when are authentication and authorization done?"
    options:
      - "Before each session to a resource"
      - "Once a year for each user"
      - "Only for traffic that comes from the internet"
      - "Only on the VPN"
    answer: 0
    explanation: "SP 800-207: they are discrete functions performed before a session is established."
    source: "Zero trust"
  - question: "Is an internal source address a reason to trust?"
    options:
      - "Yes, always"
      - "Only on weekdays"
      - "No, not on its own"
      - "Only for DMZ hosts"
    answer: 2
    explanation: "Zero trust grants no implicit trust based on network location."
    source: "Why a SOC analyst cares"
  - question: "A DMZ host connects to internal hosts. This …"
    options:
      - "is always normal"
      - "crosses a zone boundary"
      - "cannot be logged"
      - "means the DNS lookup failed"
    answer: 1
    explanation: "Check the firewall rule and the host — the traffic crosses zones."
    source: "For the agent"
  - question: "Small isolated segments make traffic …"
    options:
      - "easier to watch"
      - "impossible to route"
      - "fully encrypted"
      - "invisible to SIEM"
    answer: 0
    explanation: "SP 800-215: small segments enable close monitoring because of better visibility."
    source: "Segments inside the network"
