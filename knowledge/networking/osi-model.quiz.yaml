quiz:
  title: "The OSI model"
  questionsPerRound: 6
questions:
  - question: "Layer 1 of the OSI model is …"
    options:
      - "Data link"
      - "Physical"
      - "Network"
      - "Session"
    answer: 1
    explanation: "Layer 1 sends the raw bit stream over the physical medium."
    source: "The model"
  - question: "Which layer sends frames between physical addresses?"
    options:
      - "Network (3)"
      - "Transport (4)"
      - "Physical (1)"
      - "Data link (2)"
    answer: 3
    explanation: "Layer 2 sends frames between physical addresses and detects errors."
    source: "The model"
  - question: "Per RFC 1122, the TCP/IP application layer covers OSI …"
    options:
      - "7 and 6"
      - "7 only"
      - "5, 4 and 3"
      - "2 and 1"
    answer: 0
    explanation: "RFC 1122: application combines presentation and application; IBM adds session."
    source: "OSI and TCP/IP"
  - question: "A 'layer 4' clue in a log is …"
    options:
      - "MAC address"
      - "URL path"
      - "source / destination port"
      - "VLAN tag"
    answer: 2
    explanation: "Layer 4 evidence: ports and TCP flags."
    source: "For the agent"
  - question: "TTL and IP addresses belong to layer …"
    options:
      - "2"
      - "3"
      - "4"
      - "7"
    answer: 1
    explanation: "Layer 3 evidence: source / destination IP, TTL."
    source: "For the agent"
  - question: "Do RFC 1122 and IBM agree on the session layer?"
    options:
      - "No, IBM adds it to application"
      - "Yes, both include it"
      - "Yes, both leave it out"
      - "Neither one mentions it"
    answer: 0
    explanation: "The two sources draw the application boundary differently; both are shown."
    source: "OSI and TCP/IP"
