deck:
  title: "HTTP and HTTPS"
  description: "Recall checks drawn only from the page HTTP and HTTPS."
cards:
  - front: "What is the form of an HTTP request line?"
    back: "method SP request-target SP HTTP-version."
  - front: "Default ports for http and https URIs?"
    back: "TCP 80 and TCP 443."
  - front: "What does the first digit of a status code give?"
    back: "The class: 1xx info, 2xx success, 3xx redirect, 4xx client error, 5xx server error."
  - front: "What does the Host header carry?"
    back: "Host and port from the target URI."
  - front: "Are User-Agent and Referer proof of who the client is?"
    back: "No — they are values the client chooses to send."
