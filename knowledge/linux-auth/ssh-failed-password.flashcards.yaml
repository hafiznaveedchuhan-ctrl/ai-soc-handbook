deck:
  title: "SSH failed password"
  description: "Recall checks drawn only from the page SSH failed password."
cards:
  - front: "Rule 5716 matches…"
    back: "Lines starting 'Failed' or 'error: PAM: Authentication' (level 5)."
  - front: "Rule 5763 fires when…"
    back: "5760 is seen 8 times in 120 s from the same IP (level 10)."
  - front: "What does a single 5716/5760 usually mean?"
    back: "A user typo — note it."
  - front: "MITRE tags on 5760?"
    back: "T1110.001 and T1021.004."
  - front: "Failures then SSH accepted from the same IP?"
    back: "Escalate per the escalation policy."
